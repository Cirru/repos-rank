name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"
      - name: Install and verify
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
          calcit edit format
          git diff --quiet -- calcit.cirru
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
      - name: Build and test without GitHub API access
        run: |
          set -euo pipefail
          yarn build
          yarn test
